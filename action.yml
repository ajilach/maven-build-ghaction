name: "Maven Builder"
description: "Build and upload artifacts with maven"

inputs:
  java_version:
    description: Java runtime version
    required: false
    default: "8"
  maven_version:
    description: Maven version
    required: false
    default: "3.6.3"
  additional_profiles:
    description: "Additional mvn profiles to be executed in the mvn command (for example: 'jboss' or 'jboss,test')"
    required: false
  slack_channel_id:
    description: Slack channel id for notifications
    required: true
  op_service_account_token:
    description: 1Password service account token
    required: true
  enable_maven_dependency_check:
    description: Enabling dependency check for maven when set to 'true'
    required: false
    default: "false"
  ENABLE_OWASP_DEPENDENCY_TRACK:
    description: Enabling owasp dependency track for maven when set to 'true'
    required: false
    default: "false"
  DTRACK_REPO_OID:
    description: Repo OID of the project
    required: false
    type: string
    default: ""
  DTRACK_API_KEY:
    description: API Key for OWASP Dependency-Track
    required: false
    type: string
    default: ""
  skip_tests:
    description: Skip Maven tests
    required: false
    default: "false"
  enable_sonarqube:
    description: Enable SonarQube analysis when set to 'true'
    required: false
    default: "false"
  SONAR_PROJECT_KEY:
    description: SonarQube project key
    required: false
    default: ""
  sonar_branch_name:
    description: Optional SonarQube branch name (if empty, it will be resolved from the GitHub context)
    required: false
    default: ""

outputs:
  build_version:
    description: "Build version from POM"
    value: ${{ steps.pom-vars.outputs.build_version }}
  artefact_id:
    description: "Artifact id from POM"
    value: ${{ steps.pom-vars.outputs.artefact_id }}
  group_id:
    description: "Group id from POM"
    value: ${{ steps.pom-vars.outputs.group_id }}

runs:
  using: "composite"

  steps:
    - name: Set up JDK ${{ inputs.java_version }}
      uses: actions/setup-java@v4.7.0
      with:
        java-version: ${{ inputs.java_version }}
        distribution: "temurin"

    - name: Set up Maven
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: ${{ inputs.maven_version }}

    - name: Load Repo Secrets
      id: op-load-repo-secrets
      uses: 1password/load-secrets-action@v2.0.0
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op_service_account_token }}
        NEXUSUSER: op://ajila_CICD/NEXUS/username
        NEXUSPWD: op://ajila_CICD/NEXUS/password
        DTRACK_IP: op://ajila_CICD/OWASP_DTRACK/ip
        DTRACK_API_KEY: op://ajila_CICD/OWASP_DTRACK/api_key
        SONAR_TOKEN: op://ajila_CICD/SONARCLOUD_CICD_SERVICE_TOKEN/token_secret

    - name: Prepare maven config file
      uses: whelk-io/maven-settings-xml-action@v22
      with:
        repositories: >
          [
            {
              "id": "central",
              "url": "http://central",
              "releases": {
                "enabled": "true"
              },
              "snapshots": {
                "enabled": "true"
              }
            }
          ]
        plugin_repositories: >
          [
            {
              "id": "central",
              "url": "http://central",
              "releases": {
                "enabled": "true"
              },
              "snapshots": {
                "enabled": "true"
              }
            }
          ]
        servers: >
          [
            {
              "id": "AjilaSnapshots",
              "username": "${{ env.NEXUSUSER }}",
              "password": "${{ env.NEXUSPWD }}"
            },
            {
              "id": "AjilaReleases",
              "username": "${{ env.NEXUSUSER }}",
              "password": "${{ env.NEXUSPWD }}"
            }
          ]
        mirrors: >
          [
            {
              "id": "nexus",
              "mirrorOf": "*",
              "url": "http://nexus.internal.ajila.com/repository/public/"
            }
          ]
        profiles: >
          [
            {
              "id": "nexus"
            }
          ]
        active_profiles: >
          [
            "nexus"
          ]
        plugin_groups: >
          [
            "com.google.cloud.tools"
          ]
        output_file: .m2/settings.xml

    - name: Set output variables
      id: pom-vars
      shell: bash          # ADDED
      run: |
        echo "build_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -Pnexus --global-settings .m2/settings.xml)" >> $GITHUB_OUTPUT
        echo "artefact_id=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout -Pnexus --global-settings .m2/settings.xml)" >> $GITHUB_OUTPUT
        echo "group_id=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout -Pnexus --global-settings .m2/settings.xml)" >> $GITHUB_OUTPUT

    - name: Build and upload to nexus
      shell: bash          # ADDED
      run: |
        PROFILES="nexus"
        if [[ -n "$ADDITIONAL_PROFILES" ]]; then
          PROFILES="$PROFILES,$ADDITIONAL_PROFILES"
        fi

        MAVEN_OPTIONS=""
        if [[ "$SKIP_TESTS" == "true" ]]; then
          MAVEN_OPTIONS="-DskipTests"
        fi

        mvn --global-settings .m2/settings.xml --batch-mode $MAVEN_OPTIONS -P$PROFILES clean deploy
      env:
        ADDITIONAL_PROFILES: ${{ inputs.additional_profiles }}
        SKIP_TESTS: ${{ inputs.skip_tests }}

    - name: Upload Artifacts to Github
      uses: actions/upload-artifact@v4.6.1
      with:
        name: maven-artifacts
        path: |
          **/target/*.jar
          **/target/*.war
          **/target/*.zip
        if-no-files-found: warn

    - name: Maven Dependency Tree Dependency Submission
      uses: advanced-security/maven-dependency-submission-action@v4.1.1
      with:
        settings-file: .m2/settings.xml
      if: inputs.enable_maven_dependency_check == 'true'

    - name: Generate BOM
      if: ${{ inputs.ENABLE_OWASP_DEPENDENCY_TRACK == 'true' }}
      shell: bash
      run: |
        mvn -s .m2/settings.xml \
          -DskipTests \
          --no-transfer-progress \
          org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom \
          -Dcyclonedx.includeCompileScope=true -Dcyclonedx.includeRuntimeScope=true -Dcyclonedx.includeTransitiveDependencies=true -Dcyclonedx.includeTestScope=false

    - name: Upload BOM to Dependency-Track
      if: inputs.ENABLE_OWASP_DEPENDENCY_TRACK == 'true'
      shell: bash
      env:
        DTRACK_URL: ${{ env.DTRACK_IP }}
        DTRACK_API_KEY: ${{ env.DTRACK_API_KEY }}
        DTRACK_REPO_OID: ${{ inputs.DTRACK_REPO_OID }}
      run: |
        curl -X POST "$DTRACK_URL/api/v1/bom" \
          -H "X-Api-Key:$DTRACK_API_KEY" \
          -H "Content-Type: multipart/form-data" \
          -F "project=$DTRACK_REPO_OID" \
          -F "autoCreate=true" \
          -F "bom=@target/bom.xml"

    - name: Run SonarQube analysis
      if: inputs.enable_sonarqube == 'true'
      shell: bash
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        SONAR_PROJECT_KEY: ${{ inputs.SONAR_PROJECT_KEY }}
        INPUT_SONAR_BRANCH_NAME: ${{ inputs.sonar_branch_name }}
        GITHUB_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        GITHUB_PR_BRANCH: ${{ github.head_ref || '' }}
        GITHUB_PR_BASE: ${{ github.base_ref || '' }}
      run: |
        echo "GitHub event: $GITHUB_EVENT_NAME"

        # If this is a pull request, run PR-focused analysis so that SonarCloud decorates the PR correctly
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$GITHUB_PR_NUMBER" ]]; then
          echo "Running Sonar analysis for Pull Request #$GITHUB_PR_NUMBER"
          mvn -s .m2/settings.xml \
            --batch-mode \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.pullrequest.key="$GITHUB_PR_NUMBER" \
            -Dsonar.pullrequest.branch="$GITHUB_PR_BRANCH" \
            -Dsonar.pullrequest.base="$GITHUB_PR_BASE"
        else
          # Fallback: normal branch analysis for push events and non-PR runs
          SONAR_BRANCH_NAME="$INPUT_SONAR_BRANCH_NAME"
          if [[ -z "$SONAR_BRANCH_NAME" ]]; then
            SONAR_BRANCH_NAME="$GITHUB_BRANCH_NAME"
          fi

          echo "Resolved Sonar branch name: '$SONAR_BRANCH_NAME'"

          if [[ "$SONAR_BRANCH_NAME" == "main" || "$SONAR_BRANCH_NAME" == "master" || -z "$SONAR_BRANCH_NAME" ]]; then
            echo "Running Sonar analysis on main branch (no sonar.branch.name parameter)."
            mvn -s .m2/settings.xml \
              --batch-mode \
              org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
              -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
              -Dsonar.token="$SONAR_TOKEN"
          else
            echo "Running Sonar analysis on short-lived branch: $SONAR_BRANCH_NAME"
            mvn -s .m2/settings.xml \
              --batch-mode \
              org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
              -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
              -Dsonar.token="$SONAR_TOKEN" \
              -Dsonar.branch.name="$SONAR_BRANCH_NAME"
          fi
        fi

    - name: Notify job status
      if: always()
      uses: ajilach/notifications-ghaction@v1.5.0
      with:
        op_service_account_token: ${{ inputs.op_service_account_token }}
        slack_channel_id: ${{ inputs.slack_channel_id }}
        job_status: ${{ job.status }}